services:
  - type: web
    name: amdavad-oven-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: amdavad-oven-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://amdavad-oven.onrender.com
      - key: PROMOTIONS_ENABLED
        value: "false"
      - key: NODE_ENV
        value: production

databases:
  - name: amdavad-oven-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: amdavad_oven_db
    user: amdavad_oven_db_user
