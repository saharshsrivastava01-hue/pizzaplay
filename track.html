<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211c18"><title>Track your order · AMDAVAD OVEN</title>
<style>
:root{--ink:#211c18;--cream:#fff8ed;--paper:#fffdf8;--red:#c83d27;--muted:#756b60;--line:#eadfce;--green:#42643b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Inter,system-ui,Arial,sans-serif}.wrap{max-width:740px;margin:8vh auto;padding:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:24px}.eyebrow{font-size:.75rem;letter-spacing:2px;color:var(--red);font-weight:950}.muted{color:var(--muted)}h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.06em;margin:8px 0 15px}.status{display:inline-block;background:#e8f0e4;color:var(--green);padding:6px 12px;border-radius:99px;font-weight:900}.step{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.dot{width:13px;height:13px;border:2px solid #b5a995;border-radius:50%;margin-top:5px;flex-shrink:0}.done .dot{background:var(--green);border-color:var(--green)}.btn{border:0;border-radius:99px;background:var(--red);color:white;font-weight:850;padding:11px 16px;cursor:pointer}a{color:var(--red)}
</style></head>
<body><main class="wrap"><div class="eyebrow">ORDERWEAVE · CUSTOMER TRACKING</div><h1>Your pizza journey</h1><section class="panel"><p id="notice" class="muted">Loading order…</p><div id="details"></div><button class="btn" onclick="load()">Refresh status</button> <a href="./">Back to store</a></section></main>
<script>
const API='https://amdavad-oven-api.onrender.com';const token=new URLSearchParams(location.search).get('token');const flow=['received','accepted','preparing','baking','ready','out_for_delivery','delivered'];
async function load(){const n=document.getElementById('notice'),d=document.getElementById('details');if(!token){n.textContent='Tracking token is missing.';return}n.textContent='Connecting to order service…';try{const r=await fetch(API+'/api/orders/track/'+encodeURIComponent(token));const data=await r.json();if(!r.ok)throw new Error(data.error||'Order not found');const o=data.order;n.textContent='Order '+o.order_number+' · submitted '+new Date(o.created_at).toLocaleString();const current=flow.indexOf(o.status);d.innerHTML='<h2><span class="status">'+o.status.replaceAll('_',' ').toUpperCase()+'</span></h2><p class="muted">Total before delivery: ₹'+o.total_rupees+' · Payment: '+o.payment_status+' · '+o.fulfilment+'</p><h3>Order progress</h3>'+flow.map((s,i)=>'<div class="step '+(i<=current?'done':'')+'"><span class="dot"></span><div><b>'+s.replaceAll('_',' ')+'</b></div></div>').join('')+'<h3>Items</h3><p>'+o.items.map(i=>i.quantity+' × '+i.name+' ('+(i.variant||'')+')').join('<br>')+'</p><p class="muted">Order states are updated by restaurant staff. This page does not mean payment has been received or a delivery has been dispatched unless the displayed status is updated by the team.</p>'}catch(e){n.textContent=e.message+' (A free API may be waking up; retry shortly.)';d.innerHTML=''}}
load();
</script></body></html>
